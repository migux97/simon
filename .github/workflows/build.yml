name: Compilar APK

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Subir APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: simon-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir APK de release
        uses: actions/upload-artifact@v4
        with:
          name: simon-release
          path: app/build/outputs/apk/release/*.apk
